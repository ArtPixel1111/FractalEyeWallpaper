name: Android

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Шейдеры и веб-превью не разошлись
        run: python3 tools/sync_shader.py --check
      # Когда в репозиторий добавят gradlew, заменить на ./gradlew lint assembleDebug
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Lint и debug-сборка
        run: gradle lint assembleDebug
